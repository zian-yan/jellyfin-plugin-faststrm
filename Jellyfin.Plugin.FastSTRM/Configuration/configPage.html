<div id="FastStrmConfigurationPage" data-role="page" class="page type-interior pluginConfigurationPage" data-controller="__plugin/FastSTRM.js">
    <!-- 控件高度不写死：Jellyfin 主题本身用 padding 撑高，硬设 height 会把文字裁掉 -->
    <style>
        #FastStrmConfigurationPage .fsrm-control {
            box-sizing: border-box;
            width: 100%;
            height: auto;
            min-height: 38px;
            margin: 0;
            line-height: 1.5;
        }

        #FastStrmConfigurationPage .fsrm-control-sm {
            min-height: 36px;
        }

        /* 输入框与下拉框内部文本不换行、不裁切 */
        #FastStrmConfigurationPage .fsrm-control.emby-input,
        #FastStrmConfigurationPage .fsrm-control.emby-select {
            overflow: visible;
            text-overflow: ellipsis;
        }
    </style>
    <div class="content-primary" style="max-width: 800px;">
        
        <!-- 页面标题 -->
        <div class="verticalSection">
            <h2 class="sectionTitle" style="margin-bottom: 0.3em;">FastSTRM</h2>
        </div>

        <!-- 全库预探测面板卡片 -->
        <div class="verticalSection verticalSection-extrabottompadding">

            <!-- 面板卡片 -->
            <div style="background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 8px; padding: 1.4em;">
                
                <!-- 四大指标 -->
                <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1em; padding-bottom: 1.2em; border-bottom: 1px solid rgba(255, 255, 255, 0.06); text-align: center;">
                    <div>
                        <div style="font-size: 0.8em; color: #888; margin-bottom: 0.2em;" data-i18n="summary.total">.strm 媒体数量</div>
                        <div id="lblSummaryTotal" style="font-size: 1.6em; font-weight: 600; color: #fff;">-</div>
                    </div>
                    <div>
                        <div style="font-size: 0.8em; color: #81c784; margin-bottom: 0.2em;" data-i18n="summary.probed">已有流信息</div>
                        <div id="lblSummaryProbed" style="font-size: 1.6em; font-weight: 600; color: #4caf50;">-</div>
                    </div>
                    <div>
                        <div style="font-size: 0.8em; color: #ffb74d; margin-bottom: 0.2em;" data-i18n="summary.unprobed">缺少流信息</div>
                        <div id="lblSummaryUnprobed" style="font-size: 1.6em; font-weight: 600; color: #ff9800;">-</div>
                    </div>
                    <div>
                        <div style="font-size: 0.8em; color: #64b5f6; margin-bottom: 0.2em;" data-i18n="summary.sizeMissing">缺少文件大小</div>
                        <div id="lblSummarySizeMissing" style="font-size: 1.6em; font-weight: 600; color: #2196f3;">-</div>
                    </div>
                </div>

                <!-- 模式选择与按钮 -->
                <div class="flex align-items-center" style="gap: 0.8em; margin-top: 1.2em; flex-wrap: wrap;">
                    <div style="flex: 1; min-width: 180px;">
                        <select is="emby-select" id="selectProbeMode" class="emby-select fsrm-control" style="margin: 0;">
                            <option value="Incremental" data-i18n="probe.mode.incremental">增量探测</option>
                            <option value="Full" data-i18n="probe.mode.full">全量探测</option>
                        </select>
                    </div>
                    <div>
                        <button is="emby-button" type="button" id="btnStartProbe" class="raised button-submit" style="margin: 0; min-width: 120px; min-height: 38px; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center;">
                            <span data-i18n="probe.start">启动预探测</span>
                        </button>
                        <button is="emby-button" type="button" id="btnStopProbe" class="raised" style="margin: 0; min-width: 120px; min-height: 38px; box-sizing: border-box; display: none; background: #b71c1c; color: white; align-items: center; justify-content: center;">
                            <span data-i18n="probe.stop">停止</span>
                        </button>
                    </div>
                </div>

                <!-- 实时进度区域 -->
                <div id="probeProgressSection" style="margin-top: 1.4em;">
                    <div style="font-size: 0.85em; margin-bottom: 0.5em;">
                        <span id="lblTaskStatus" style="color: #999;"><span data-i18n="status.prefix">执行状态: </span><span id="lblTaskState" data-i18n="status.state.Idle">空闲</span></span>
                    </div>

                    <div style="width: 100%; height: 6px; background: rgba(255, 255, 255, 0.08); border-radius: 3px; overflow: hidden;">
                        <div id="probeProgressBar" style="width: 0%; height: 100%; background: #00a4dc; transition: width 0.25s ease;"></div>
                    </div>

                    <div id="probeCurrentItemRow" style="font-size: 0.8em; color: #777; margin-top: 0.6em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                        <span data-i18n="probe.currentItemLabel">正在探测: </span><span id="lblCurrentItem" style="color: #bbb;">-</span>
                    </div>
                </div>

            </div>
        </div>

        <!-- 配置表单区 -->
        <form class="fastStrmConfigurationForm">
            <div class="verticalSection verticalSection-extrabottompadding">
                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="txtProbeConcurrency" data-i18n="config.concurrency">探测并发数</label>
                    <input is="emby-input" type="number" id="txtProbeConcurrency" min="1" max="16" step="1" value="1" />
                </div>
                <div style="margin-bottom: 0.2em;">
                    <span style="font-weight: 600;" data-i18n="config.remoteSize">补全远端文件大小</span>
                    <span style="color: #888; font-size: 0.85em;" data-i18n="config.remoteSizeAlwaysOn">（始终启用）</span>
                </div>
                <div class="inputContainer">
                    <label class="inputLabel inputLabelUnfocused" for="txtRemoteSizeTimeout" data-i18n="config.remoteSizeTimeout">大小请求超时（秒）</label>
                    <input is="emby-input" type="number" id="txtRemoteSizeTimeout" min="1" max="60" step="1" value="10" />
                </div>
                <div class="checkboxContainer checkboxContainer-anonymouscheckbox" id="allowPrivateNetworkTargetsContainer">
                    <label>
                        <input is="emby-checkbox" type="checkbox" id="chkAllowPrivateNetworkTargets" />
                        <span data-i18n="config.allowPrivateNetworkTargets">允许请求内网地址</span>
                    </label>
                </div>
                <div class="checkboxContainer checkboxContainer-anonymouscheckbox">
                    <label>
                        <input is="emby-checkbox" type="checkbox" id="chkEnableAutoProbe" />
                        <span data-i18n="config.autoProbe">Strm入库自动探测</span>
                    </label>
                </div>
                <div class="checkboxContainer checkboxContainer-anonymouscheckbox">
                    <label>
                        <input is="emby-checkbox" type="checkbox" id="chkSkipProbeForUnprobedStrm" />
                        <span data-i18n="config.skipUnprobed">未探测的 STRM 文件也跳过探测</span>
                    </label>
                </div>

                <div id="unprobedPlaybackOptions" style="margin-left: 1.7em; margin-bottom: 1em;">
                    <div class="selectContainer">
                        <label class="selectLabel" for="selectUnprobedPlaybackMode" data-i18n="config.afterStartMode">起播后策略</label>
                        <select is="emby-select" id="selectUnprobedPlaybackMode" class="emby-select-withcolor emby-select">
                            <option value="None" data-i18n="config.afterStart.none">不补探测（默认）</option>
                            <option value="Background" data-i18n="config.afterStart.background">后台补探测</option>
                        </select>
                    </div>

                    <div class="inputContainer" id="backgroundProbeDelayContainer">
                        <label class="inputLabel inputLabelUnfocused" for="txtBackgroundProbeDelay" data-i18n="config.backgroundDelay">补探测延迟（秒）</label>
                        <input is="emby-input" type="number" id="txtBackgroundProbeDelay" min="0" max="3600" step="1" value="5" />
                    </div>

                    <div id="cancelProbeOnStopContainer">
                        <div class="checkboxContainer checkboxContainer-anonymouscheckbox" style="margin-top: 0.4em;">
                            <label>
                                <input is="emby-checkbox" type="checkbox" id="chkCancelProbeOnPlaybackStop" />
                                <span data-i18n="config.cancelOnStop">播放停止后取消补探测</span>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- 按用户播放策略 -->
                <div id="userPlaybackPolicySection" style="margin-top: 1.6em; padding-top: 1.4em; border-top: 1px solid rgba(255, 255, 255, 0.08);">
                    <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 1em; flex-wrap: wrap;">
                        <h3 style="margin: 0; font-size: 1.05em; font-weight: 600;" data-i18n="userPolicy.title">按用户播放策略</h3>
                        <span id="lblUserPolicySummary" style="font-size: 0.8em; color: #888;">-</span>
                    </div>

                    <div id="userPolicyEmpty" style="margin-top: 0.9em; font-size: 0.85em; color: #777;" data-i18n="userPolicy.empty">
                        暂无用户级配置，所有用户继承全局策略。
                    </div>

                    <div id="userPolicyRows" style="display: flex; flex-direction: column; gap: 0.55em; margin-top: 0.9em;"></div>

                    <div style="display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.6fr) minmax(0, 0.9fr) auto; gap: 0.6em; align-items: end; margin-top: 1.1em; padding-top: 1em; border-top: 1px dashed rgba(255, 255, 255, 0.1);">
                        <div style="min-width: 0;">
                            <label class="inputLabel inputLabelUnfocused" for="selectAddUserPolicyUser" style="display: block; font-size: 0.8em; color: #888; margin-bottom: 0.3em;" data-i18n="userPolicy.user">用户</label>
                            <select class="emby-select fsrm-control fsrm-control-sm" id="selectAddUserPolicyUser" style="margin: 0;"></select>
                        </div>
                        <div style="min-width: 0;">
                            <label class="inputLabel inputLabelUnfocused" for="selectAddUserPolicyMode" style="display: block; font-size: 0.8em; color: #888; margin-bottom: 0.3em;" data-i18n="userPolicy.mode">播放策略</label>
                            <select class="emby-select fsrm-control fsrm-control-sm" id="selectAddUserPolicyMode" style="margin: 0;">
                                <option value="InstantNoProbe" data-i18n="policyMode.InstantNoProbe">跳过探测 · 不补探测</option>
                                <option value="InstantBackgroundProbe" data-i18n="policyMode.InstantBackgroundProbe">跳过探测 · 后台补探测</option>
                                <option value="OfficialProbe" data-i18n="policyMode.OfficialProbe">不跳过探测（官方 ffprobe）</option>
                            </select>
                        </div>
                        <div style="min-width: 0;">
                            <label class="inputLabel inputLabelUnfocused" for="txtAddUserPolicyDelay" style="display: block; font-size: 0.8em; color: #888; margin-bottom: 0.3em;" data-i18n="config.backgroundDelay">补探测延迟（秒）</label>
                            <input type="number" class="emby-input fsrm-control fsrm-control-sm" id="txtAddUserPolicyDelay" min="0" max="3600" step="1" style="margin: 0;" />
                        </div>
                        <div>
                            <button is="emby-button" type="button" id="btnAddUserPolicy" class="raised" style="margin: 0; min-height: 36px; min-width: 84px;">
                                <span data-i18n="userPolicy.add">添加</span>
                            </button>
                        </div>
                    </div>

                </div>

                <div>
                    <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                        <span data-i18n="common.save">保存</span>
                    </button>
                </div>
            </div>
        </form>

    </div>
</div>
